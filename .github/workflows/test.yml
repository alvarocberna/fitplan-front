name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (incluye los mocks de los e2e)
        run: npm run test:e2e:types
      - name: Unitarios
        run: npm test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (build de producción + backend falso validado contra el contrato)
        run: npx playwright test
      - name: Reporte de los e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
