name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Tipos (incluye los mocks de los e2e)
        run: npm run test:e2e:types
      - name: Unitarios
        run: npm test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (build de producción + backend falso validado contra el contrato)
        run: npx playwright test
      - name: Reporte de los e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Vulnerabilidades en dependencias
        run: npm audit --audit-level=moderate
